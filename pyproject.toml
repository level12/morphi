[build-system]
requires = [
    'hatchling',
]
build-backend = 'hatchling.build'


[project]
name = 'morphi'
description = 'i18n services for libraries and applications'
authors = [
    {name = 'Level 12 Developers', email = 'devteam@level12.io'},
]
requires-python = '>=3.12'
dynamic = ['version']
readme = 'readme.md'
license = 'BSD-3-Clause'
license-files = ['license.txt']
classifiers = [
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
dependencies = [
    'Babel',
    'pytz',
    'setuptools',
    'speaklater',
    'tomli',
]


[project.urls]
Homepage = 'https://github.com/level12/morphi'
Repository = 'https://github.com/level12/morphi'


[project.optional-dependencies]
develop = [
    'nox',
    'pytest',
    'pytest-cov',
    'ruff==0.16.2',
]
tests = [
    'pytest',
    'pytest-cov',
]


[project.entry-points.'distutils.commands']
compile_catalog = 'babel.messages.frontend:compile_catalog'
extract_messages = 'babel.messages.frontend:extract_messages'
init_catalog = 'babel.messages.frontend:init_catalog'
update_catalog = 'babel.messages.frontend:update_catalog'
compile_json = 'morphi.messages.frontend:CompileJson'


[dependency-groups]
dev = [
    {include-group = "pytest"},
    {include-group = "prek"},
    {include-group = "audit"},
    {include-group = "build"},
    {include-group = "nox"},
    'click',
    'ruff==0.16.2',
]
# Used by nox
pytest = [
    'pytest',
    'pytest-cov',
]
# Used by nox
prek = [
    'prek',
]
# Used by nox
audit = [
    'pip-audit',
]
# Used by nox
build = [
    'build',
    'twine',
]
# Used by CI
nox = [
    'nox',
]


# Babel command configuration migrated from setup.cfg.
[tool.babel.extract_messages]
mapping_file = 'i18n/babel.cfg'
keywords = ['_', '_n']
output_file = 'i18n/messages.pot'
input_dirs = ['src/morphi']


[tool.babel.init_catalog]
input_file = 'i18n/messages.pot'
output_dir = 'i18n'


[tool.babel.update_catalog]
input_file = 'i18n/messages.pot'
output_dir = 'i18n'


[tool.babel.compile_catalog]
directory = 'i18n'


[tool.babel.compile_json]
directory = 'i18n'
